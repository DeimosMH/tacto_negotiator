[project]
name = "tacto-negotiator"
version = "0.1.0"
description = "A deadline-aware procurement buyer with deterministic negotiation, model routing and local competitions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["httpx>=0.27", "openpyxl>=3.1", "pypdf>=5"]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
mcp = ["mcp>=2.3,<3"]
sim = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
tacto = "tacto_negotiator.cli:main"
tacto-sim = "tacto_negotiator.sim:main"
tacto-compete = "tacto_negotiator.compete:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tacto_negotiator"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "pyproject.toml", "uv.lock", "README.md", "LICENSE", "NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["materials"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"docs/*.py" = ["E501"]
